# =============================================================================
# FastCrossMap 多平台发布工作流
# 自动构建 Linux, Windows, macOS 二进制文件
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Linux 构建 (x86_64 和 aarch64)
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: 安装 cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: 构建
        run: cross build --release --target ${{ matrix.target }}
      
      - name: 打包
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p release
          if [[ "${{ matrix.target }}" == *"musl"* ]]; then
            PLATFORM="linux-x86_64-static"
          elif [[ "${{ matrix.target }}" == *"aarch64"* ]]; then
            PLATFORM="linux-arm64"
          else
            PLATFORM="linux-x86_64"
          fi

          NAME="fcm-${VERSION}-${PLATFORM}"
          mkdir -p "$NAME"
          cp target/${{ matrix.target }}/release/fast-crossmap "$NAME/"
          sha256sum "$NAME/fast-crossmap" > "$NAME/SHA256SUMS"
          tar -czvf "release/${NAME}.tar.gz" "$NAME"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: release/*.tar.gz

  # ===========================================================================
  # Windows 构建
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 构建
        run: cargo build --release
      
      - name: 打包
        shell: pwsh
        run: |
          $version = ((Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value)
          $name = "fcm-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path release
          New-Item -ItemType Directory -Force -Path $name
          Copy-Item target/release/fast-crossmap.exe "$name/"
          $hash = (Get-FileHash "$name/fast-crossmap.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name/fast-crossmap.exe" | Out-File -FilePath "$name/SHA256SUMS" -Encoding ascii
          # 添加说明文件
          $readmePath = "$name/README.txt"
          "FastCrossMap for Windows" | Out-File -FilePath $readmePath -Encoding utf8
          "========================`n" | Out-File -FilePath $readmePath -Encoding utf8 -Append
          "Supported formats: BED, BAM, SAM, VCF, GVCF, GFF, GTF, Wiggle, bedGraph, BigWig, MAF`n" | Out-File -FilePath $readmePath -Encoding utf8 -Append

          Compress-Archive -Path $name -DestinationPath "release/$name.zip"
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.zip

  # ===========================================================================
  # macOS 构建 (Intel 和 Apple Silicon)
  # ===========================================================================
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: 打包
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p release
          if [[ "${{ matrix.target }}" == *"aarch64"* ]]; then
            PLATFORM="macos-arm64"
          else
            PLATFORM="macos-x86_64"
          fi

          NAME="fcm-${VERSION}-${PLATFORM}"
          mkdir -p "$NAME"
          cp target/${{ matrix.target }}/release/fast-crossmap "$NAME/"
          shasum -a 256 "$NAME/fast-crossmap" > "$NAME/SHA256SUMS"
          tar -czvf "release/${NAME}.tar.gz" "$NAME"
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: release/*.tar.gz

  # ===========================================================================
  # 创建 Release
  # ===========================================================================
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: 整理文件
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
